# ports/config/build-features.ini
# Deterministic optional-dependency policies enabled during `kryx-src plan` and `kryx-src pkg`.
# Ensures flagship ports build with full features via `prt-get isinst` inside clean containers.

[wlroots]
extra_deps = xorg-xwayland xorg-libxcomposite xorg-xcb-util-errors xorg-xcb-util-renderutil

[sway]
extra_deps = xorg-xwayland

[linux-firmware]
extra_deps = parallel
