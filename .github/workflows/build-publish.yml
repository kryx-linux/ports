name: Build Packages with kryx-src and Publish Rolling Repo

on:
  workflow_dispatch:
    inputs:
      port_repo:
        description: Source repository containing CRUX Pkgfile ports
        type: string
        required: true
        default: kryx-linux/ports
      port_ref:
        description: Branch, tag, or commit in port_repo
        type: string
        required: true
        default: main
      port_path:
        description: Space-separated port path(s), package name(s), collection(s), or "all" (e.g. "linux-6.18", "kernel", "rolling", or "all")
        type: string
        required: true
        default: kernel
      image_ref:
        description: CRUX rolling container image reference
        type: string
        required: true
        default: ghcr.io/kryx-linux/image:latest
      release_tag:
        description: Target GitHub Release tag in kryx-linux/ports
        type: string
        required: true
        default: rolling-x86_64
      build_deps:
        description: Also resolve and satisfy recursive Pkgfile dependencies (--deps)
        type: boolean
        required: false
        default: false
      source_deps:
        description: Build missing dependencies from source instead of reusing binary index (--source-deps)
        type: boolean
        required: false
        default: false
      ignore_footprint:
        description: Skip .footprint verification (--ignore-footprint)
        type: boolean
        required: false
        default: false
      ignore_md5sum:
        description: Skip .md5sum verification (--ignore-md5sum)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: read

concurrency:
  group: rolling-publish-${{ inputs.release_tag || 'rolling-x86_64' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source port repository (with submodules)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          ref: ${{ inputs.port_ref || 'main' }}
          submodules: recursive
          path: port_src

      - name: Package port tree for container build
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
        run: |
          set -euo pipefail
          PKGFILE_COUNT="$(find port_src -name Pkgfile -type f | wc -l)"
          echo "Found $PKGFILE_COUNT Pkgfile(s) in $PORT_REPO"
          if [ "$PKGFILE_COUNT" -eq 0 ]; then
            echo "error: no Pkgfile found in $PORT_REPO" >&2
            ls -la port_src >&2 || true
            exit 1
          fi
          tar --exclude='.git' -cf port-src.tar -C port_src .
          ls -lh port-src.tar

      - name: Upload port tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: port-src-bundle
          path: port-src.tar
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image_ref || 'ghcr.io/kryx-linux/image:latest' }}
    steps:
      - name: Download port tree artifact
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Verify CRUX container and preinstalled kryx-src / pe tools
        run: |
          set -euo pipefail
          if command -v crux >/dev/null 2>&1; then
            crux
          fi
          test -x /usr/bin/pe
          test -x /usr/bin/pe-index
          /usr/bin/pe --version
          if [ -x /usr/bin/kryx-src ]; then
            /usr/bin/kryx-src --version
          else
            echo "warning: /usr/bin/kryx-src not found in container image; rebuild ghcr.io/kryx-linux/image for unified kryx-src support" >&2
          fi

      - name: Build target port(s) with kryx-src
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          PORT_PATH: ${{ inputs.port_path || 'kernel' }}
          RELEASE_TAG: ${{ inputs.release_tag || 'rolling-x86_64' }}
          BUILD_DEPS: ${{ inputs.build_deps }}
          SOURCE_DEPS: ${{ inputs.source_deps }}
          IGNORE_FOOTPRINT: ${{ inputs.ignore_footprint }}
          IGNORE_MD5SUM: ${{ inputs.ignore_md5sum }}
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/kryx-work"
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          PKG_DIR="$OUT_DIR/packages"
          RAW_PORT_SRC="$WORK_ROOT/port_src"
          rm -rf "$WORK_ROOT" "$OUT_DIR"
          mkdir -p "$RAW_PORT_SRC" "$PKG_DIR" "$OUT_DIR/bin"

          tar -xf "$GITHUB_WORKSPACE/port_bundle/port-src.tar" -C "$RAW_PORT_SRC"

          read -r -a TARGET_PORTS <<< "$PORT_PATH"
          if [ "${#TARGET_PORTS[@]}" -eq 0 ]; then
            echo "error: no target ports specified in port_path" >&2
            exit 1
          fi

          if [ -x /usr/bin/kryx-src ]; then
            echo "=== Lint target port(s) ==="
            /usr/bin/kryx-src lint --ports "$RAW_PORT_SRC" "${TARGET_PORTS[@]}" || true

            SRC_FLAGS=(
              --ports "$RAW_PORT_SRC"
              --port-repo "$PORT_REPO"
              --work-root "$WORK_ROOT"
              --out-dir "$PKG_DIR"
              --repo "$GITHUB_REPOSITORY"
              --tag "$RELEASE_TAG"
              --arch x86_64
              --jobs "$(nproc)"
              --compression zst
              --force
              --color never
            )
            if [ "$BUILD_DEPS" = "true" ]; then
              SRC_FLAGS+=(--deps --sync-index)
            fi
            if [ "$SOURCE_DEPS" = "true" ]; then
              SRC_FLAGS+=(--source-deps)
            fi
            if [ "$IGNORE_FOOTPRINT" = "true" ]; then
              SRC_FLAGS+=(--ignore-footprint)
            fi
            if [ "$IGNORE_MD5SUM" = "true" ]; then
              SRC_FLAGS+=(--ignore-md5sum)
            fi

            echo "=== Building ports via kryx-src: ${TARGET_PORTS[*]} ==="
            /usr/bin/kryx-src pkg "${SRC_FLAGS[@]}" "${TARGET_PORTS[@]}"
            cp -f /usr/bin/kryx-src "$OUT_DIR/bin/kryx-src"
            chmod 0755 "$OUT_DIR/bin/kryx-src"
          else
            # Fallback for older container images prior to kryx-src installation.
            mkdir -p "$WORK_ROOT/cache" "$WORK_ROOT/sources" "$WORK_ROOT/work"
            PORTS_DIR="$RAW_PORT_SRC"
            if [ -f "$RAW_PORT_SRC/Pkgfile" ]; then
              ROOT_PORT_NAME="$(cd "$RAW_PORT_SRC" && bash -c 'set -e; source ./Pkgfile >/dev/null; printf "%s" "${name:-}"')"
              ROOT_PORT_NAME="${ROOT_PORT_NAME:-${PORT_REPO##*/}}"
              PORTS_DIR="$WORK_ROOT/ports"
              mkdir -p "$PORTS_DIR/$ROOT_PORT_NAME"
              cp -a "$RAW_PORT_SRC/." "$PORTS_DIR/$ROOT_PORT_NAME/"
              TARGET_PORTS=("$ROOT_PORT_NAME")
            fi
            PE_CONF="$WORK_ROOT/pe.ci.ini"
            cat > "$PE_CONF" <<EOF
          [paths]
          root = /
          ports_dir = $PORTS_DIR
          collections =
          cache_dir = $WORK_ROOT/cache
          source_cache = $WORK_ROOT/sources
          package_dir = $PKG_DIR
          work_dir = $WORK_ROOT/work

          [repo]
          repository = $GITHUB_REPOSITORY
          tag = $RELEASE_TAG
          arch = x86_64
          timeout_seconds = 600

          [build]
          jobs = $(nproc)
          cflags = -O2 -march=x86-64 -pipe
          cxxflags = -O2 -march=x86-64 -pipe
          compression = zst
          download_sources = true
          strip = true
          compress_manpages = true
          ignore_footprint = false
          ignore_new = false
          ignore_md5sum = false
          ignore_signature = true
          keep_work = false
          download_prog = curl

          [ui]
          color = never
          EOF
            BUILD_FLAGS=(--force)
            [ "$BUILD_DEPS" = "true" ] && BUILD_FLAGS+=(--deps)
            [ "$SOURCE_DEPS" = "true" ] && BUILD_FLAGS+=(--source-deps)
            [ "$IGNORE_FOOTPRINT" = "true" ] && BUILD_FLAGS+=(--ignore-footprint)
            [ "$IGNORE_MD5SUM" = "true" ] && BUILD_FLAGS+=(--ignore-md5sum)
            /usr/bin/pe --config "$PE_CONF" build "${BUILD_FLAGS[@]}" "${TARGET_PORTS[@]}"
          fi

          shopt -s nullglob
          BUILT=("$PKG_DIR"/*.pkg.tar.*)
          if [ "${#BUILT[@]}" -eq 0 ]; then
            echo "error: build produced no .pkg.tar.* archives" >&2
            exit 1
          fi
          ls -lh "${BUILT[@]}"

          cp -f /usr/bin/pe-index "$OUT_DIR/bin/pe-index"
          chmod 0755 "$OUT_DIR/bin/pe-index"
          tar -cf "$OUT_DIR/bundle.tar" -C "$OUT_DIR" packages bin
          ls -lh "$OUT_DIR/bundle.tar"

      - name: Upload built packages and static release tools
        uses: actions/upload-artifact@v4
        with:
          name: pe-built-bundle
          path: dist/bundle.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download port tree artifact (for metadata enrichment)
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Download built packages and static release tools
        uses: actions/download-artifact@v4
        with:
          name: pe-built-bundle
          path: bundle

      - name: Stage index.json and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'rolling-x86_64' }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/release-stage"
          UPLOAD_DIR="$STAGE_DIR/upload"
          RAW_PORT_SRC="$STAGE_DIR/port_src"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR" "$UPLOAD_DIR" "$RAW_PORT_SRC"

          tar -xf bundle/bundle.tar -C "$STAGE_DIR"
          tar -xf port_bundle/port-src.tar -C "$RAW_PORT_SRC"

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rolling x86_64 Packages" \
              --notes "Automated rolling x86_64 CRUX binary packages and pe-index metadata."
          fi

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$STAGE_DIR" \
            --pattern "index.json" \
            --clobber || true

          if [ -x "$STAGE_DIR/bin/kryx-src" ]; then
            "$STAGE_DIR/bin/kryx-src" stage \
              --packages "$STAGE_DIR/packages" \
              --ports "$RAW_PORT_SRC" \
              --index "$STAGE_DIR/index.json" \
              --upload-dir "$UPLOAD_DIR" \
              --arch "$TARGET_ARCH" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

            shopt -s nullglob
            UPLOAD_FILES=("$UPLOAD_DIR"/*)
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${UPLOAD_FILES[@]}" \
              --clobber

            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$STAGE_DIR/assets.json"

            "$STAGE_DIR/bin/kryx-src" rewrite-urls \
              --index "$STAGE_DIR/index.json" \
              --assets-json "$STAGE_DIR/assets.json" \
              --packages "$STAGE_DIR/packages"
          else
            chmod 0755 "$STAGE_DIR/bin/pe-index"
            "$STAGE_DIR/bin/pe-index" \
              --packages "$STAGE_DIR/packages" \
              --index "$STAGE_DIR/index.json" \
              --ports "$RAW_PORT_SRC" \
              --arch "$TARGET_ARCH" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

            shopt -s nullglob
            ARCHIVES=("$STAGE_DIR/packages"/*.pkg.tar.*)
            UPLOAD_FILES=()
            for f in "${ARCHIVES[@]}"; do
              orig="$(basename "$f")"
              safe="${orig//#/.}"
              cp -f "$f" "$UPLOAD_DIR/$safe"
              UPLOAD_FILES+=("$UPLOAD_DIR/$safe")
            done
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${UPLOAD_FILES[@]}" --clobber
            ASSETS_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
            jq --argjson assets "$ASSETS_JSON" '
              ($assets.assets | map({(.name): .url}) | add // {}) as $urlmap |
              .packages |= with_entries(
                .value.versions |= map(
                  (.filename | gsub("#"; ".")) as $safe |
                  if $urlmap[.filename] then .url = $urlmap[.filename]
                  elif $urlmap[$safe] then .url = $urlmap[$safe]
                  else . end
                )
              )
            ' "$STAGE_DIR/index.json" > "$STAGE_DIR/index.json.tmp"
            mv "$STAGE_DIR/index.json.tmp" "$STAGE_DIR/index.json"
          fi

          test -s "$STAGE_DIR/index.json"
          cat "$STAGE_DIR/index.json"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$STAGE_DIR/index.json" \
            --clobber
