name: Build Packages with kryx-src (Matrix) and Publish Rolling Repo

on:
  workflow_dispatch:
    inputs:
      port_repo:
        description: Source repository containing CRUX Pkgfile ports
        type: string
        required: true
        default: kryx-linux/ports
      port_ref:
        description: Branch, tag, or commit in port_repo
        type: string
        required: true
        default: main
      port_path:
        description: Space-separated port path(s), package name(s), collection(s), or "all"
        type: string
        required: true
        default: kernel
      image_ref:
        description: CRUX/KryX rolling container image reference
        type: string
        required: true
        default: ghcr.io/kryx-linux/image:latest
      release_tag:
        description: Target GitHub Release tag in kryx-linux/ports
        type: string
        required: true
        default: rolling-x86_64
      max_ports:
        description: Max ports per workflow run (protects GitHub free-tier concurrency limits)
        type: string
        required: false
        default: "20"
      chunk_size:
        description: Ports per matrix job (1 = 1 job per package with full 6h budget)
        type: string
        required: false
        default: "1"
      build_deps:
        description: Also resolve and satisfy recursive Pkgfile runtime + make deps (--deps)
        type: boolean
        required: false
        default: false
      source_deps:
        description: Build missing dependencies from source instead of reusing binary index (--source-deps)
        type: boolean
        required: false
        default: false
      ignore_footprint:
        description: Skip .footprint verification (--ignore-footprint)
        type: boolean
        required: false
        default: false
      ignore_md5sum:
        description: Skip .md5sum verification (--ignore-md5sum)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: read

concurrency:
  group: rolling-publish-${{ inputs.release_tag || 'rolling-x86_64' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base collection repositories (core, opt, contrib, xorg)
        run: |
          set -euo pipefail
          mkdir -p port_src
          for repo in core opt contrib xorg; do
            echo "Cloning kryx-linux/${repo} into port_src/${repo}..."
            git clone --depth 1 "https://github.com/kryx-linux/${repo}.git" "port_src/${repo}"
          done

      - name: Checkout target source port repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          ref: ${{ inputs.port_ref || 'main' }}
          submodules: false
          path: target_repo_tmp

      - name: Initialize non-base submodules and merge directly into port_src root
        run: |
          set -euo pipefail
          cd target_repo_tmp

          if [ -f .gitmodules ]; then
            git config --file .gitmodules --get-regexp path | awk '{ print $2 }' | while read -r sub_path; do
              case "$sub_path" in
                core|opt|contrib|xorg)
                  echo "Skipping base submodule $sub_path (already cloned)"
                  ;;
                *)
                  echo "Initializing submodule $sub_path..."
                  git submodule update --init --depth 1 "$sub_path" || {
                    echo "Warning: shallow fetch failed for $sub_path, trying full fetch..."
                    git submodule update --init "$sub_path"
                  }
                  ;;
              esac
            done
          fi

          for repo in core opt contrib xorg; do
            if [ -d "$repo" ] && [ -z "$(ls -A "$repo")" ]; then
              rmdir "$repo"
            fi
          done

          cp -a . ../port_src/
          cd ..
          rm -rf target_repo_tmp

      - name: Package port tree for container build
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
        run: |
          set -euo pipefail
          PKGFILE_COUNT="$(find port_src -name Pkgfile -type f | wc -l)"
          echo "Found $PKGFILE_COUNT total Pkgfile(s) across base collections and $PORT_REPO"
          ls -la port_src
          if [ "$PKGFILE_COUNT" -eq 0 ]; then
            echo "error: no Pkgfile found in port_src" >&2
            exit 1
          fi
          tar --exclude='.git' -cf port-src.tar -C port_src .
          ls -lh port-src.tar

      - name: Upload port tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: port-src-bundle
          path: port-src.tar
          retention-days: 1

  plan:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image_ref || 'ghcr.io/kryx-linux/image:latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_ports: ${{ steps.plan.outputs.total_ports }}
      truncated: ${{ steps.plan.outputs.truncated }}
    steps:
      - name: Download port tree artifact
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Generate bounded topological build matrix
        id: plan
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          PORT_PATH: ${{ inputs.port_path || 'kernel' }}
          MAX_PORTS: ${{ inputs.max_ports || '20' }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '1' }}
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/plan-src"
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          tar -xf "$GITHUB_WORKSPACE/port_bundle/port-src.tar" -C "$SRC_DIR"
          read -r -a RAW_PORTS <<< "$PORT_PATH"

          TARGET_PORTS=()
          for item in "${RAW_PORTS[@]}"; do
            if [ "$item" = "all" ] || [ -d "$SRC_DIR/$item" ]; then
              TARGET_PORTS+=("$item")
            else
              MATCH="$(find "$SRC_DIR" -maxdepth 4 -type f -path "*/${item}/Pkgfile" | head -n 1 || true)"
              if [ -n "$MATCH" ]; then
                REL_PATH="${MATCH#"$SRC_DIR"/}"
                REL_PATH="${REL_PATH%/Pkgfile}"
                echo "Resolved '$item' -> '$REL_PATH'"
                TARGET_PORTS+=("$REL_PATH")
              else
                echo "error: could not find '$item' anywhere in $SRC_DIR" >&2
                find "$SRC_DIR" -maxdepth 2 -mindepth 1 -type d | sort >&2
                exit 1
              fi
            fi
          done

          if [ -x /usr/bin/kryx-src ]; then
            PLAN_JSON="$(/usr/bin/kryx-src plan \
              --ports "$SRC_DIR" \
              --port-repo "$PORT_REPO" \
              --max-ports "$MAX_PORTS" \
              --chunk-size "$CHUNK_SIZE" \
              --compact \
              "${TARGET_PORTS[@]}")"
            echo "Plan JSON: $PLAN_JSON"
            {
              echo "matrix<<__KRYX_MATRIX_EOF__"
              printf '%s\n' "$PLAN_JSON"
              echo "__KRYX_MATRIX_EOF__"
            } >> "$GITHUB_OUTPUT"
            TOTAL_PORTS="$(printf '%s' "$PLAN_JSON" | tr -d '\n' | sed -n 's/.*"total_ports":[[:space:]]*\([0-9]*\).*/\1/p')"
            echo "total_ports=${TOTAL_PORTS:-0}" >> "$GITHUB_OUTPUT"
            if printf '%s' "$PLAN_JSON" | tr -d '\n' | grep -Eq '"truncated":[[:space:]]*true'; then
              echo "truncated=true" >> "$GITHUB_OUTPUT"
            else
              echo "truncated=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "warning: /usr/bin/kryx-src absent; running single-job matrix fallback" >&2
            ESC_PATH="${TARGET_PORTS[*]//\\/\\\\}"
            ESC_PATH="${ESC_PATH//\"/\\\"}"
            FALLBACK="{\"total_ports\":1,\"truncated\":false,\"include\":[{\"id\":\"batch\",\"wave\":0,\"ports\":[\"$ESC_PATH\"],\"port_arg\":\"$ESC_PATH\",\"pkg_names\":[]}]}"
            echo "matrix=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "total_ports=1" >> "$GITHUB_OUTPUT"
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: [prepare, plan]
    # Skip (instead of failing strategy evaluation) when the plan resolved zero jobs.
    if: ${{ needs.plan.outputs.matrix != '' && fromJson(needs.plan.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      # Only pass the job list; top-level scalars (total_ports, truncated) are not valid matrix vectors.
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix).include }}
    container:
      image: ${{ inputs.image_ref || 'ghcr.io/kryx-linux/image:latest' }}
    steps:
      - name: Download port tree artifact
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Build assigned matrix port(s)
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          JOB_PORTS: ${{ matrix.port_arg }}
          JOB_ID: ${{ matrix.id }}
          RELEASE_TAG: ${{ inputs.release_tag || 'rolling-x86_64' }}
          BUILD_DEPS: ${{ inputs.build_deps }}
          SOURCE_DEPS: ${{ inputs.source_deps }}
          IGNORE_FOOTPRINT: ${{ inputs.ignore_footprint }}
          IGNORE_MD5SUM: ${{ inputs.ignore_md5sum }}
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/kryx-work"
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          PKG_DIR="$OUT_DIR/packages"
          RAW_PORT_SRC="$WORK_ROOT/port_src"
          rm -rf "$WORK_ROOT" "$OUT_DIR"
          mkdir -p "$RAW_PORT_SRC" "$PKG_DIR" "$OUT_DIR/bin"

          tar -xf "$GITHUB_WORKSPACE/port_bundle/port-src.tar" -C "$RAW_PORT_SRC"
          read -r -a TARGET_PORTS <<< "$JOB_PORTS"

          if [ -x /usr/bin/kryx-src ]; then
            /usr/bin/kryx-src lint --ports "$RAW_PORT_SRC" "${TARGET_PORTS[@]}" || true
            SRC_FLAGS=(
              --ports "$RAW_PORT_SRC"
              --port-repo "$PORT_REPO"
              --work-root "$WORK_ROOT"
              --out-dir "$PKG_DIR"
              --repo "$GITHUB_REPOSITORY"
              --tag "$RELEASE_TAG"
              --arch x86_64
              --jobs "$(nproc)"
              --compression zst
              --force
              --color never
            )
            [ "$BUILD_DEPS" = "true" ] && SRC_FLAGS+=(--deps --sync-index)
            [ "$SOURCE_DEPS" = "true" ] && SRC_FLAGS+=(--source-deps)
            [ "$IGNORE_FOOTPRINT" = "true" ] && SRC_FLAGS+=(--ignore-footprint)
            [ "$IGNORE_MD5SUM" = "true" ] && SRC_FLAGS+=(--ignore-md5sum)

            echo "=== Matrix job [$JOB_ID]: kryx-src pkg ${TARGET_PORTS[*]} ==="
            /usr/bin/kryx-src pkg "${SRC_FLAGS[@]}" "${TARGET_PORTS[@]}"
            cp -f /usr/bin/kryx-src "$OUT_DIR/bin/kryx-src"
            chmod 0755 "$OUT_DIR/bin/kryx-src"
          else
            mkdir -p "$WORK_ROOT/cache" "$WORK_ROOT/sources" "$WORK_ROOT/work"
            PE_CONF="$WORK_ROOT/pe.ci.ini"
            cat > "$PE_CONF" <<EOF
          [paths]
          root = /
          ports_dir = $RAW_PORT_SRC
          collections =
          cache_dir = $WORK_ROOT/cache
          source_cache = $WORK_ROOT/sources
          package_dir = $PKG_DIR
          work_dir = $WORK_ROOT/work

          [repo]
          repository = $GITHUB_REPOSITORY
          tag = $RELEASE_TAG
          arch = x86_64
          timeout_seconds = 600

          [build]
          jobs = $(nproc)
          cflags = -O2 -march=x86-64 -pipe
          cxxflags = -O2 -march=x86-64 -pipe
          compression = zst
          download_sources = true
          strip = true
          compress_manpages = true
          ignore_footprint = false
          ignore_new = false
          ignore_md5sum = false
          ignore_signature = true
          keep_work = false
          download_prog = curl

          [ui]
          color = never
          EOF
            BUILD_FLAGS=(--force)
            [ "$BUILD_DEPS" = "true" ] && BUILD_FLAGS+=(--deps)
            [ "$SOURCE_DEPS" = "true" ] && BUILD_FLAGS+=(--source-deps)
            [ "$IGNORE_FOOTPRINT" = "true" ] && BUILD_FLAGS+=(--ignore-footprint)
            [ "$IGNORE_MD5SUM" = "true" ] && BUILD_FLAGS+=(--ignore-md5sum)
            /usr/bin/pe --config "$PE_CONF" build "${BUILD_FLAGS[@]}" "${TARGET_PORTS[@]}"
          fi

          shopt -s nullglob
          BUILT=("$PKG_DIR"/*.pkg.tar.*)
          if [ "${#BUILT[@]}" -eq 0 ]; then
            echo "error: build produced no .pkg.tar.* archives" >&2
            exit 1
          fi
          ls -lh "${BUILT[@]}"

          cp -f /usr/bin/pe-index "$OUT_DIR/bin/pe-index"
          chmod 0755 "$OUT_DIR/bin/pe-index"

          SAFE_ID="$(printf '%s' "$JOB_ID" | tr '/: ' '---')"
          echo "SAFE_ID=$SAFE_ID" >> "$GITHUB_ENV"
          tar -cf "$OUT_DIR/bundle-${SAFE_ID}.tar" -C "$OUT_DIR" packages bin

      - name: Upload built package bundle
        uses: actions/upload-artifact@v4
        with:
          name: pe-built-${{ env.SAFE_ID }}
          path: dist/bundle-*.tar
          retention-days: 1

  publish:
    needs: [prepare, plan, build]
    if: always() && needs.prepare.result == 'success' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Download port tree artifact (for metadata enrichment)
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Download all built matrix package bundles
        uses: actions/download-artifact@v4
        with:
          pattern: pe-built-*
          path: bundles
          merge-multiple: true

      - name: Atomically stage, sign, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          KRYX_SIGNING_KEY: ${{ secrets.KRYX_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag || 'rolling-x86_64' }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/release-stage"
          UPLOAD_DIR="$STAGE_DIR/upload"
          RAW_PORT_SRC="$STAGE_DIR/port_src"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/packages" "$STAGE_DIR/bin" "$UPLOAD_DIR" "$RAW_PORT_SRC"

          shopt -s nullglob
          TAR_LIST=(bundles/bundle-*.tar)
          if [ "${#TAR_LIST[@]}" -eq 0 ]; then
            echo "error: no matrix build jobs produced package bundles" >&2
            exit 1
          fi
          for b in "${TAR_LIST[@]}"; do
            tar -xf "$b" -C "$STAGE_DIR"
          done
          tar -xf port_bundle/port-src.tar -C "$RAW_PORT_SRC"

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rolling x86_64 Packages" \
              --notes "Automated rolling x86_64 CRUX/KryX binary packages and pe-index metadata."
          fi

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$STAGE_DIR" \
            --pattern "index.json" \
            --clobber || true

          if [ -x "$STAGE_DIR/bin/kryx-src" ]; then
            "$STAGE_DIR/bin/kryx-src" stage \
              --packages "$STAGE_DIR/packages" \
              --ports "$RAW_PORT_SRC" \
              --index "$STAGE_DIR/index.json" \
              --upload-dir "$UPLOAD_DIR" \
              --arch "$TARGET_ARCH" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

            UPLOAD_FILES=("$UPLOAD_DIR"/*)
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${UPLOAD_FILES[@]}" \
              --clobber

            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$STAGE_DIR/assets.json"

            "$STAGE_DIR/bin/kryx-src" rewrite-urls \
              --index "$STAGE_DIR/index.json" \
              --assets-json "$STAGE_DIR/assets.json" \
              --packages "$STAGE_DIR/packages"

            # Optional Ed25519 signing when KRYX_SIGNING_KEY secret is configured.
            META_FILES=("$STAGE_DIR/index.json")
            if [ -n "${KRYX_SIGNING_KEY:-}" ]; then
              KEY_FILE="$STAGE_DIR/signing.key"
              printf '%s\n' "$KRYX_SIGNING_KEY" > "$KEY_FILE"
              chmod 0600 "$KEY_FILE"
              "$STAGE_DIR/bin/kryx-src" sign --key "$KEY_FILE" --file "$STAGE_DIR/index.json"
              rm -f "$KEY_FILE"
              META_FILES+=("$STAGE_DIR/index.json.sig")
            fi

            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${META_FILES[@]}" \
              --clobber
          else
            chmod 0755 "$STAGE_DIR/bin/pe-index"
            "$STAGE_DIR/bin/pe-index" \
              --packages "$STAGE_DIR/packages" \
              --index "$STAGE_DIR/index.json" \
              --ports "$RAW_PORT_SRC" \
              --arch "$TARGET_ARCH" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

            ARCHIVES=("$STAGE_DIR/packages"/*.pkg.tar.*)
            UPLOAD_FILES=()
            for f in "${ARCHIVES[@]}"; do
              orig="$(basename "$f")"
              safe="${orig//#/.}"
              cp -f "$f" "$UPLOAD_DIR/$safe"
              UPLOAD_FILES+=("$UPLOAD_DIR/$safe")
            done
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${UPLOAD_FILES[@]}" --clobber
            ASSETS_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
            jq --argjson assets "$ASSETS_JSON" '
              ($assets.assets | map({(.name): .url}) | add // {}) as $urlmap |
              .packages |= with_entries(
                .value.versions |= map(
                  (.filename | gsub("#"; ".")) as $safe |
                  if $urlmap[.filename] then .url = $urlmap[.filename]
                  elif $urlmap[$safe] then .url = $urlmap[$safe]
                  else . end
                )
              )
            ' "$STAGE_DIR/index.json" > "$STAGE_DIR/index.json.tmp"
            mv "$STAGE_DIR/index.json.tmp" "$STAGE_DIR/index.json"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$STAGE_DIR/index.json" --clobber
          fi

          if [ "${{ needs.plan.outputs.truncated }}" = "true" ]; then
            echo "::warning::Build plan was capped at max_ports=${{ inputs.max_ports || '20' }} out of ${{ needs.plan.outputs.total_ports }} total ports. Trigger another run for remaining ports."
          fi
