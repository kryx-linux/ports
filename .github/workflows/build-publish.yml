name: Build Packages with pe and Publish Rolling Repo

on:
  workflow_dispatch:
    inputs:
      port_repo:
        description: Source repository containing CRUX Pkgfile ports
        type: string
        required: true
        default: kryx-linux/ports
      port_ref:
        description: Branch, tag, or commit in port_repo
        type: string
        required: true
        default: main
      port_path:
        description: Space-separated port path(s) to build (e.g. "kernel", "zig", "rolling/gports", "gports", or "all")
        type: string
        required: true
        default: kernel
      image_ref:
        description: CRUX rolling container image reference
        type: string
        required: true
        default: ghcr.io/kryx-linux/image:latest
      release_tag:
        description: Target GitHub Release tag in kryx-linux/packages
        type: string
        required: true
        default: rolling-x86_64
      build_deps:
        description: Also build recursive Pkgfile dependencies (pe build --deps)
        type: boolean
        required: false
        default: false
      ignore_footprint:
        description: Skip .footprint verification (pe build --ignore-footprint)
        type: boolean
        required: false
        default: false
      ignore_md5sum:
        description: Skip .md5sum verification (pe build --ignore-md5sum)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: read

concurrency:
  group: rolling-publish-${{ inputs.release_tag || 'rolling-x86_64' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout external port repository (with submodules)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          ref: ${{ inputs.port_ref || 'main' }}
          submodules: recursive
          path: port_src

      - name: Package port tree for container build
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
        run: |
          set -euo pipefail
          PKGFILE_COUNT="$(find port_src -name Pkgfile -type f | wc -l)"
          echo "Found $PKGFILE_COUNT Pkgfile(s) in $PORT_REPO"
          if [ "$PKGFILE_COUNT" -eq 0 ]; then
            echo "error: no Pkgfile found in $PORT_REPO" >&2
            ls -la port_src >&2 || true
            if [ -f port_src/.gitmodules ]; then
              echo "--- .gitmodules ---" >&2
              cat port_src/.gitmodules >&2
            fi
            find port_src -maxdepth 3 -not -path '*/.git*' >&2 || true
            exit 1
          fi
          tar --exclude='.git' -cf port-src.tar -C port_src .
          ls -lh port-src.tar

      - name: Upload port tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: port-src-bundle
          path: port-src.tar
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image_ref || 'ghcr.io/kryx-linux/image:latest' }}
    steps:
      - name: Download port tree artifact
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Verify CRUX container and preinstalled pe tools
        run: |
          set -euo pipefail
          if command -v crux >/dev/null 2>&1; then
            crux
          fi
          test -x /usr/bin/pe
          test -x /usr/bin/pe-index
          test -f /etc/pe.ini
          /usr/bin/pe --version
          PE_INDEX_HELP="$(/usr/bin/pe-index --help 2>&1 || true)"
          grep -q "Usage of pe-index" <<< "$PE_INDEX_HELP"

      - name: Build target port(s) with /usr/bin/pe
        env:
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          PORT_PATH: ${{ inputs.port_path || 'kernel' }}
          RELEASE_TAG: ${{ inputs.release_tag || 'rolling-x86_64' }}
          BUILD_DEPS: ${{ inputs.build_deps }}
          IGNORE_FOOTPRINT: ${{ inputs.ignore_footprint }}
          IGNORE_MD5SUM: ${{ inputs.ignore_md5sum }}
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/pe-work"
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          PKG_DIR="$OUT_DIR/packages"
          RAW_PORT_SRC="$WORK_ROOT/port_src"
          rm -rf "$WORK_ROOT" "$OUT_DIR"
          mkdir -p "$WORK_ROOT/cache" "$WORK_ROOT/sources" "$WORK_ROOT/work" "$RAW_PORT_SRC" "$PKG_DIR" "$OUT_DIR/bin"

          tar -xf "$GITHUB_WORKSPACE/port_bundle/port-src.tar" -C "$RAW_PORT_SRC"

          PORTS_DIR="$RAW_PORT_SRC"
          ROOT_PORT_NAME=""
          if [ -f "$RAW_PORT_SRC/Pkgfile" ]; then
            ROOT_PORT_NAME="$(cd "$RAW_PORT_SRC" && bash -c 'set -e; source ./Pkgfile >/dev/null; printf "%s" "${name:-}"')"
            if [ -z "$ROOT_PORT_NAME" ]; then
              ROOT_PORT_NAME="${PORT_REPO##*/}"
            fi
            PORTS_DIR="$WORK_ROOT/ports"
            mkdir -p "$PORTS_DIR/$ROOT_PORT_NAME"
            cp -a "$RAW_PORT_SRC/." "$PORTS_DIR/$ROOT_PORT_NAME/"
          fi

          PE_CONF="$WORK_ROOT/pe.ci.ini"
          cat > "$PE_CONF" <<EOF
          [paths]
          root = /
          ports_dir = $PORTS_DIR
          collections =
          cache_dir = $WORK_ROOT/cache
          source_cache = $WORK_ROOT/sources
          package_dir = $PKG_DIR
          work_dir = $WORK_ROOT/work

          [repo]
          repository = $GITHUB_REPOSITORY
          tag = $RELEASE_TAG
          arch = x86_64
          timeout_seconds = 600

          [build]
          jobs = $(nproc)
          cflags = -O2 -march=x86-64 -pipe
          cxxflags = -O2 -march=x86-64 -pipe
          compression = zst
          download_sources = true
          strip = true
          compress_manpages = true
          ignore_footprint = false
          ignore_new = false
          ignore_md5sum = false
          ignore_signature = true
          keep_work = false
          download_prog = curl

          [ui]
          color = never
          EOF

          BUILD_FLAGS=(--force)
          if [ "$BUILD_DEPS" = "true" ]; then
            BUILD_FLAGS+=(--deps)
          fi
          if [ "$IGNORE_FOOTPRINT" = "true" ]; then
            BUILD_FLAGS+=(--ignore-footprint)
          fi
          if [ "$IGNORE_MD5SUM" = "true" ]; then
            BUILD_FLAGS+=(--ignore-md5sum)
          fi

          if [ -n "$ROOT_PORT_NAME" ]; then
            REPO_BASENAME="${PORT_REPO##*/}"
            NORM_PATH="${PORT_PATH#./}"
            NORM_PATH="${NORM_PATH%/}"
            if [ -z "$NORM_PATH" ] || [ "$NORM_PATH" = "." ] || [ "$NORM_PATH" = "all" ] || [ "$NORM_PATH" = "$ROOT_PORT_NAME" ] || [ "$NORM_PATH" = "$REPO_BASENAME" ]; then
              TARGET_PORTS=("$ROOT_PORT_NAME")
            else
              echo "error: single-port repo $PORT_REPO defines '$ROOT_PORT_NAME' at repo root, not '$PORT_PATH'" >&2
              exit 1
            fi
          elif [ "$PORT_PATH" = "all" ]; then
            mapfile -t TARGET_PORTS < <(/usr/bin/pe --config "$PE_CONF" list --ports)
          else
            read -r -a RAW_PORTS <<< "$PORT_PATH"
            TARGET_PORTS=()
            for p in "${RAW_PORTS[@]}"; do
              p="${p#./}"
              p="${p%/}"
              if [ -n "$p" ]; then
                TARGET_PORTS+=("$p")
              fi
            done
          fi

          if [ "${#TARGET_PORTS[@]}" -eq 0 ]; then
            echo "error: no ports selected to build" >&2
            exit 1
          fi

          mapfile -t DISCOVERED_PORTS < <(/usr/bin/pe --config "$PE_CONF" list --ports)
          echo "Discovered ${#DISCOVERED_PORTS[@]} port(s) in $PORTS_DIR"
          if [ "${#DISCOVERED_PORTS[@]}" -eq 0 ]; then
            echo "error: no Pkgfile ports found in $PORTS_DIR (checked out $PORT_REPO)" >&2
            ls -la "$PORTS_DIR" >&2 || true
            exit 1
          elif [ "${#DISCOVERED_PORTS[@]}" -le 50 ]; then
            printf '  %s\n' "${DISCOVERED_PORTS[@]}"
          fi
          echo "Building ports: ${TARGET_PORTS[*]}"
          /usr/bin/pe --config "$PE_CONF" build "${BUILD_FLAGS[@]}" "${TARGET_PORTS[@]}"

          shopt -s nullglob
          BUILT=("$PKG_DIR"/*.pkg.tar.*)
          if [ "${#BUILT[@]}" -eq 0 ]; then
            echo "error: /usr/bin/pe build produced no .pkg.tar.* archives" >&2
            exit 1
          fi
          ls -lh "${BUILT[@]}"

          cp -f /usr/bin/pe-index "$OUT_DIR/bin/pe-index"
          chmod 0755 "$OUT_DIR/bin/pe-index"
          tar -cf "$OUT_DIR/bundle.tar" -C "$OUT_DIR" packages bin
          ls -lh "$OUT_DIR/bundle.tar"

      - name: Upload built packages and static pe-index artifact
        uses: actions/upload-artifact@v4
        with:
          name: pe-built-bundle
          path: dist/bundle.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download port tree artifact (for pe-index metadata)
        uses: actions/download-artifact@v4
        with:
          name: port-src-bundle
          path: port_bundle

      - name: Download built packages and static pe-index artifact
        uses: actions/download-artifact@v4
        with:
          name: pe-built-bundle
          path: bundle

      - name: Update index.json and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PORT_REPO: ${{ inputs.port_repo || 'kryx-linux/ports' }}
          RELEASE_TAG: ${{ inputs.release_tag || 'rolling-x86_64' }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/release-stage"
          UPLOAD_DIR="$STAGE_DIR/upload"
          RAW_PORT_SRC="$STAGE_DIR/port_src"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR" "$UPLOAD_DIR" "$RAW_PORT_SRC"

          tar -xf bundle/bundle.tar -C "$STAGE_DIR"
          chmod 0755 "$STAGE_DIR/bin/pe-index"
          tar -xf port_bundle/port-src.tar -C "$RAW_PORT_SRC"

          PORTS_DIR="$RAW_PORT_SRC"
          if [ -f "$RAW_PORT_SRC/Pkgfile" ]; then
            ROOT_PORT_NAME="$(cd "$RAW_PORT_SRC" && bash -c 'set -e; source ./Pkgfile >/dev/null; printf "%s" "${name:-}"')"
            if [ -z "$ROOT_PORT_NAME" ]; then
              ROOT_PORT_NAME="${PORT_REPO##*/}"
            fi
            PORTS_DIR="$STAGE_DIR/ports"
            mkdir -p "$PORTS_DIR/$ROOT_PORT_NAME"
            cp -a "$RAW_PORT_SRC/." "$PORTS_DIR/$ROOT_PORT_NAME/"
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rolling x86_64 Packages" \
              --notes "Automated rolling x86_64 CRUX binary packages and pe-index metadata."
          fi

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$STAGE_DIR" \
            --pattern "index.json" \
            --clobber || true

          "$STAGE_DIR/bin/pe-index" \
            --packages "$STAGE_DIR/packages" \
            --index "$STAGE_DIR/index.json" \
            --ports "$PORTS_DIR" \
            --arch "$TARGET_ARCH" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          shopt -s nullglob
          ARCHIVES=("$STAGE_DIR/packages"/*.pkg.tar.*)
          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "error: no package archives to upload" >&2
            exit 1
          fi

          # GitHub Releases replaces '#' with '.' in asset names and `gh release upload`
          # interprets '#' as file#label, so upload with GitHub-safe filenames while
          # preserving the CRUX '#' filename field in index.json for `pe install`.
          UPLOAD_FILES=()
          for f in "${ARCHIVES[@]}"; do
            orig="$(basename "$f")"
            safe="${orig//#/.}"
            cp -f "$f" "$UPLOAD_DIR/$safe"
            UPLOAD_FILES+=("$UPLOAD_DIR/$safe")
          done

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${UPLOAD_FILES[@]}" \
            --clobber

          # Rewrite index.json download URLs to the exact browser_download_url values
          # reported by GitHub Releases for the uploaded assets.
          ASSETS_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          jq --argjson assets "$ASSETS_JSON" '
            ($assets.assets | map({(.name): .url}) | add // {}) as $urlmap |
            .packages |= with_entries(
              .value.versions |= map(
                (.filename | gsub("#"; ".")) as $safe |
                if $urlmap[.filename] then
                  .url = $urlmap[.filename]
                elif $urlmap[$safe] then
                  .url = $urlmap[$safe]
                else
                  .
                end
              )
            )
          ' "$STAGE_DIR/index.json" > "$STAGE_DIR/index.json.tmp"
          mv "$STAGE_DIR/index.json.tmp" "$STAGE_DIR/index.json"

          # Verify every newly built package has a matching uploaded release asset URL.
          for f in "${ARCHIVES[@]}"; do
            orig="$(basename "$f")"
            safe="${orig//#/.}"
            resolved_url="$(jq -r --arg fn "$orig" '
              .packages[]?.versions[]? | select(.filename == $fn) | .url
            ' "$STAGE_DIR/index.json" | head -n 1)"
            if [ -z "$resolved_url" ] || ! grep -Fq "/${safe}" <<< "$resolved_url"; then
              echo "error: index.json URL for $orig ($resolved_url) does not match uploaded asset $safe" >&2
              exit 1
            fi
          done

          test -s "$STAGE_DIR/index.json"
          cat "$STAGE_DIR/index.json"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$STAGE_DIR/index.json" \
            --clobber
